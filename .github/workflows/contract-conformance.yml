# Reusable Level 2 contract-conformance workflow (CR-AM-11 §14).
#
# The caller's immutable dea-metamodel reference supplies the contract suite
# and touchpoint schema. The caller must independently pin the validator source.
name: Contract conformance (reusable)

on:
  workflow_call:
    inputs:
      dea-metamodel-ref:
        required: true
        type: string
        description: "Immutable dea-metamodel reference: tag vX.Y.Z or 40-char SHA. Mutable refs are rejected."
      manifest-path:
        required: false
        type: string
        default: model.yaml
      assessment-ci-ref:
        required: false
        type: string
        description: "Optional immutable assessment-ci validator source commit (40-character SHA). When supplied, enables touchpoint structural validation; omitted callers retain the legacy validator baseline."

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — dea-metamodel-ref must be immutable
        shell: bash
        run: |
          ref="${{ inputs.dea-metamodel-ref }}"
          case "$ref" in
            main|master|latest|HEAD|head)
              echo "FAIL — dea-metamodel-ref '$ref' is mutable (CR-AM-11 section 12)"
              exit 1 ;;
          esac
          if ! echo "$ref" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$|^[0-9a-f]{40}$'; then
            echo "FAIL — dea-metamodel-ref '$ref' is neither a vX.Y.Z tag nor a 40-char SHA"
            exit 1
          fi
          echo "OK — immutable ref: $ref"

      - name: Check out caller repository
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Check out pinned dea-metamodel contract suite and schemas
        uses: actions/checkout@v4
        with:
          repository: technehub-labs/dea-metamodel
          ref: ${{ inputs.dea-metamodel-ref }}
          path: dea-metamodel

      - name: Guard — assessment-ci-ref must be immutable
        if: ${{ inputs.assessment-ci-ref != '' }}
        shell: bash
        run: |
          ref="${{ inputs.assessment-ci-ref }}"
          if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL — assessment-ci-ref '$ref' is not a 40-character commit SHA"
            exit 1
          fi
          echo "OK — immutable assessment-ci ref: $ref"

      - name: Check out pinned assessment-ci validators
        uses: actions/checkout@v4
        with:
          repository: Assessment-Models/assessment-ci
          ref: ${{ inputs.assessment-ci-ref || '9c0fb2596f5a2d3bd0b33787feed1ef5861c909a' }}
          path: assessment-ci

      - name: Install validator dependencies
        run: pip install pyyaml jsonschema

      - name: Level 2 basic — manifest + handshake shape
        run: |
          python assessment-ci/scripts/validate_handshake.py "caller/${{ inputs.manifest-path }}"
          python assessment-ci/scripts/check_immutable_refs.py "caller/${{ inputs.manifest-path }}"

      - name: Level 2 full — resolve handshake against the pinned contract suite
        run: python assessment-ci/scripts/resolve_contract.py "caller/${{ inputs.manifest-path }}" --suite dea-metamodel/assessment-models/contracts/contract-suite.yaml

      - name: Level 2 touchpoints — validate optional declaration against the pinned schema
        if: ${{ inputs.assessment-ci-ref != '' }}
        run: python assessment-ci/scripts/validate_touchpoints.py "caller/${{ inputs.manifest-path }}" --schema dea-metamodel/assessment-models/schemas/maturity-touchpoints.schema.json --suite dea-metamodel/assessment-models/contracts/contract-suite.yaml
